name: Android
on:
  push:
    branches: ['main', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Descargar modelos Qwen
        run: python scripts/fetch-qwen.py

      - name: Compilar Capri con voz incluida
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug -PbundleQwen=true

      - uses: actions/upload-artifact@v4
        with:
          name: Capri-Android-completo
          path: app/build/outputs/apk/debug/app-debug.apk
